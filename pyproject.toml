[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embeduino"
version = "0.1.0"
description = "Niche-docs RAG for Arduino / embedded documentation with structure-aware chunking"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ayush Pandey" }]
dependencies = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
embeduino = "embeduino.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["embeduino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
